<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenty Partners Screens</title>
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#002c1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
<style>
/* Layout: a wall of numbered phone screens grouped by flow, on the Lenty cream ground */
:root{
  color-scheme:light;
  --ground:#f4f2ea; --card:#fffdf8; --ink:#002c1f; --muted:#6a7069; --line:#e3dfd2; --cream:#eee2c9; --accent:#2e6a50;
  --display:"Prata",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --scale:.62;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);padding:0 20px 80px}
header{background:var(--ink);color:var(--cream);margin:0 -20px 36px;padding:36px 20px 30px}
.wrap{max-width:1400px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:14px 0 8px;text-wrap:balance}
header p{margin:0;max-width:64ch;color:rgba(238,226,201,.78);line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:14px;text-decoration:none}
.a1{background:var(--cream);color:var(--ink)}
.a2{border:1px solid rgba(238,226,201,.35);color:var(--cream)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:40px 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(390px * var(--scale) + 24px),1fr));gap:26px 18px}
.shot{display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;color:inherit}
.phone{width:calc(390px * var(--scale));height:calc(844px * var(--scale));border-radius:calc(46px * var(--scale));overflow:hidden;background:#0b120f;padding:calc(8px * var(--scale));box-shadow:0 14px 34px rgba(0,44,31,.18);position:relative}
.phone .in{width:100%;height:100%;border-radius:calc(38px * var(--scale));overflow:hidden;position:relative;background:var(--ground)}
.phone iframe{width:390px;height:844px;border:0;transform:scale(var(--scale));transform-origin:0 0;pointer-events:none;position:absolute;top:0;left:0;width:calc(100% / var(--scale));height:calc(100% / var(--scale))}
.shot:hover .phone,.shot:focus-visible .phone{outline:3px solid var(--accent);outline-offset:3px}
.shot:focus-visible{outline:none}
.meta{display:flex;gap:10px;align-items:baseline}
.n{font-family:var(--display);font-size:20px;color:var(--accent);min-width:28px;font-variant-numeric:tabular-nums}
.t{font-weight:600;font-size:15px}
.d{font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.logo{color:var(--cream)}
@media (max-width:520px){:root{--scale:.5}}
</style>
</head>
<body>
<header><div class="wrap">
  <svg class="logo" height="30" viewBox="141 350 753 308" fill="currentColor" aria-label="Lenty" role="img"><use href="#lenty"/></svg>
  <h1>Lenty Partners: all screens</h1>
  <p>Every screen of the v1.02 prototype with sample data. Use the number when you ask for a change, for example “screen 8, move the commission card down”. Click a screen to open it full size.</p>
  <div class="actions"><a class="a1" href="./">Open the interactive app</a><a class="a2" href="https://github.com/Lenty-Mortgage/lenty-partners/commits/main">Change history</a></div>
</div></header>
<main class="wrap" id="main"></main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="lenty"></g></defs></svg>
<script>
const GROUPS=[
 ['Sign up','First launch for a new agent.',[
  ['welcome','Welcome','Brand promise and the three key numbers.'],
  ['phone','Mobile number','Country code and phone.'],
  ['otp','SMS code','6-digit code with resend timer.'],
  ['profile','About you','Name, agency, broker card (BRN).'],
  ['agreement','Referral terms','Summary of the referral agreement.','agree=1'],
 ]],
 ['Everyday','The four tabs in the bottom bar.',[
  ['today','Today','Commission, attention list, active deals.'],
  ['today','Today · updates','Bell icon: latest updates on all deals.','sheet=updates'],
  ['deals','Deals','All referred clients by status.'],
  ['wallet','Wallet','Paid, awaiting payout, pipeline, bank account.'],
  ['tools','Tools','Calculators, link & QR, rates, agreement.'],
 ]],
 ['A deal','What the agent sees for one client.',[
  ['deal','Deal · legal stage','Ahmed: contract & NOC, 6 of 8.','deal=ahmed'],
  ['deal','Deal · mortgage stage','Olena: pre-approval, documents missing.','deal=olena'],
  ['deal','Deal · awaiting payout','Chloe: disbursed, 45-day countdown.','deal=chloe'],
 ]],
 ['Refer a client','Three steps from the Refer button.',[
  ['refer','Refer · step 1','Client name and phone.','step=1'],
  ['refer','Refer · step 2','Property, residency, live commission.','step=2'],
  ['refer','Refer · step 3','Advisor by language, consent.','step=3'],
  ['refer','Choose advisor','List of Lenty advisors.','step=3&sheet=advisor'],
  ['done','Referral sent','What happens next.'],
 ]],
 ['Tools','Opened from the Tools tab.',[
  ['check','Quick check','Affordability by UAE Central Bank rules.'],
  ['calc','Repayments & costs','Monthly payment and cash on transfer day.'],
  ['link','Link & QR code','Personal referral link and WhatsApp text.'],
  ['rates','Rate card','Weekly rates with the agent\'s name.'],
  ['tools','Referral agreement','Full terms.','sheet=agreement'],
 ]],
 ['Account','Opened from the avatar on Today.',[
  ['account','Account','Profile, notifications, help, log out.'],
  ['wallet','Payout account','IBAN for commission payouts.','sheet=iban'],
 ]],
];
let n=0;
document.getElementById('main').innerHTML=GROUPS.map(([g,sub,items])=>`<section><h2>${g}</h2><p class="sub">${sub}</p><div class="grid">${items.map(([s,t,d,q])=>{n++;const url=`./?screen=${s}${q?'&'+q:''}`;return `<a class="shot" href="${url}" target="_blank" rel="noopener" aria-label="Screen ${n}: ${t}"><div class="phone"><div class="in"><iframe loading="lazy" src="${url}" title="${t}" tabindex="-1"></iframe></div></div><div class="meta"><span class="n">${n}</span><div><div class="t">${t}</div><div class="d">${d}</div></div></div></a>`}).join('')}</div></section>`).join('');
fetch('icon.svg').then(r=>r.text()).then(t=>{const paths=[...t.matchAll(/<path d="([^"]+)"/g)].map(m=>`<path d="${m[1]}"/>`).join('');document.getElementById('lenty').innerHTML=paths}).catch(()=>{});
</script>
</body>
</html>
