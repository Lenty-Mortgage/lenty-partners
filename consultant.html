<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenty Team · Qualification</title>
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#002c1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
<style>
/* Layout: desktop work tool for Lenty consultants — queue table on the left, lead card on the right, Lenty green/cream */
:root{
  color-scheme:light;
  --ground:#f4f2ea; --card:#fffdf8; --ink:#002c1f; --ink-2:#1e4034; --muted:#6a7069; --line:#e3dfd2; --line-2:#efece3;
  --accent:#2e6a50; --accent-ink:#1e4d3a; --accent-soft:#e4ede6; --cream:#eee2c9; --sand:#b79d84;
  --good:#1d7a4a; --good-soft:#e1f2e6; --warn:#9c5a00; --warn-soft:#fbf0d6; --bad:#b8382d; --bad-soft:#fbe9e6;
  --display:"Prata",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.serif{font-family:var(--display);font-weight:400}

/* Top bar */
.top{background:var(--ink);color:var(--cream);position:sticky;top:0;z-index:20}
.top .in{max-width:1440px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--cream)}
.brand .lbl{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(238,226,201,.7)}
.tabs{display:flex;gap:4px;height:100%}
.tab{height:100%;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:600;color:rgba(238,226,201,.65);border-bottom:2px solid transparent}
.tab.on{color:var(--cream);border-bottom-color:var(--cream)}
.tab[disabled]{cursor:default}
.soon{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(238,226,201,.14);padding:2px 7px;border-radius:999px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(238,226,201,.75)}
.who select{background:rgba(238,226,201,.1);border:1px solid rgba(238,226,201,.25);color:var(--cream);border-radius:10px;height:36px;padding:0 10px}
.who select option{color:var(--ink)}
.who a{color:var(--cream);font-weight:600;text-decoration:none;border:1px solid rgba(238,226,201,.3);border-radius:10px;height:36px;display:inline-flex;align-items:center;padding:0 12px}

/* Page */
.page{max-width:1440px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(400px,.8fr);gap:18px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}.lead{position:static;max-height:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:13px}
.note a{color:inherit;font-weight:600}

/* Filters */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.chip .n{font-size:12px;opacity:.75}

/* Queue table */
.qtable{overflow-x:auto}
.qrow{display:grid;grid-template-columns:minmax(170px,1.5fr) minmax(130px,1fr) 118px 120px 110px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);width:100%;text-align:left;min-width:700px}
.qrow.h{border-top:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:14px;padding-bottom:10px}
button.qrow:hover{background:var(--line-2)}
button.qrow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cname{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)}
.dots i.no{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:var(--line-2);color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--line-2);color:var(--muted)}
.tag.risk{background:var(--bad-soft);color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Lead card */
.lead{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.lead .sec{padding:16px 18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.lead .sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.stepn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.stepn.ok{background:var(--good);color:#fff}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.btn{height:40px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-accent{background:var(--accent);color:#fff}
.btn-line{background:var(--card);border:1px solid var(--line)}
.btn-bad{background:var(--card);border:1px solid #e9c3be;color:var(--bad)}
.btn[disabled]{background:var(--line-2);color:#a8a392;border-color:transparent;cursor:not-allowed}
.btn-wide{width:100%;height:46px;font-size:14.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.verdict{border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdict.good{background:var(--good-soft)}.verdict.warn{background:var(--warn-soft)}.verdict.bad{background:var(--bad-soft)}
.verdict .v{font-family:var(--display);font-size:20px}
.verdict.good .v{color:var(--good)}.verdict.warn .v{color:var(--warn)}.verdict.bad .v{color:var(--bad)}
.outcome{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.missing{font-size:12.5px;color:var(--muted)}
.tpl{background:var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px}
.log{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.log div{display:flex;gap:8px}
.log time{color:var(--muted);flex:none;min-width:86px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:14px;font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,44,31,.3);max-width:min(560px,calc(100vw - 32px))}
.demo{font-size:12.5px;color:var(--muted)}
.demo summary{cursor:pointer;font-weight:600}
.toggle{width:46px;height:28px;border-radius:999px;background:#d0cbbb;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--accent)}.toggle.on::after{transform:translateX(18px)}
.toggle[disabled]{opacity:.45;cursor:not-allowed}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.acard{padding:18px;display:flex;flex-direction:column;gap:14px}
.acard h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.swrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btable{overflow-x:auto}
.brow2{display:grid;grid-template-columns:minmax(140px,1.1fr) minmax(130px,1fr) 110px 120px 92px 92px minmax(170px,auto);gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2);min-width:980px}
.brow2.h{border-top:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat{background:var(--line-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px}

</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg height="24" viewBox="141 350 753 308" fill="currentColor" role="img" aria-label="Lenty"><use href="#lenty"/></svg><span class="lbl">Team</span></div>
  <nav class="tabs"><button class="tab" id="tab-queue" onclick="setTab('queue')">Qualification</button><button class="tab" id="tab-admin" onclick="setTab('admin')">Admin</button></nav>
  <div class="who"><label for="me">Signed in as</label><select id="me"></select><a href="./" target="_blank" rel="noopener">Agent app ↗</a></div>
</div></header>
<main class="page" id="page"></main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="lenty"></g></defs></svg>

<script>
/* ===================== Settings (same values as the agent app; in production: configuration table, edited in the Admin tab) ===================== */
const SETTINGS={bonus_amount_aed:100,starter_bonus_amount_aed:150,starter_bonus_count:3,monthly_limit:10,qualification_days:14,cancel_window_days:30,decision_working_days:2,starter_bonus_enabled:true};
let PROGRAMME_END=Date.UTC(2026,10,30,20,0,0); /* 1 Dec 2026 00:00 Dubai; overridden by the Admin tab */
/* Admin settings, shared with the agent app through this browser's storage */
const ADMIN_KEY='lenty-admin-v1.02';
const ADMIN_DEFAULTS={lead_bonus_enabled:true,starter_bonus_enabled:true,lead_bonus_starts_at:null,lead_bonus_ends_at:Date.UTC(2026,10,30,20,0,0),bonus_amount_aed:100,starter_bonus_amount_aed:150,starter_bonus_count:3,monthly_limit:10,cancel_window_days:30,promo_slot:{text:'',link:'',from:null,to:null}};
let ADMIN=ADMIN_DEFAULTS;
function loadAdmin(){try{return Object.assign({},ADMIN_DEFAULTS,JSON.parse(localStorage.getItem(ADMIN_KEY)||'{}'))}catch(e){return Object.assign({},ADMIN_DEFAULTS)}}
function programmeOn(a,now){now=now||Date.now();return !!a.lead_bonus_enabled&&!(a.lead_bonus_starts_at&&now<a.lead_bonus_starts_at)&&!(a.lead_bonus_ends_at&&now>=a.lead_bonus_ends_at)}
function applyAdmin(){const a=ADMIN=loadAdmin();['bonus_amount_aed','starter_bonus_amount_aed','starter_bonus_count','monthly_limit','cancel_window_days'].forEach(k=>SETTINGS[k]=+a[k]);SETTINGS.starter_bonus_enabled=!!a.starter_bonus_enabled;PROGRAMME_END=a.lead_bonus_ends_at||Infinity}
const CONSENT_TEXT_VERSION='consent-2026-10';
const DAY=864e5;
const AGENT_KEY='lenty-partners-v1.02';   /* agent app storage (same browser) */
const TEAM_KEY='lenty-team-v1.02';        /* demo leads of other agents */

/* ===================== Texts (translation keys, English like the whole app) ===================== */
const TXT={
  "team.title":"Qualification queue",
  "team.sub":"Leads have {days} days from submission to qualify. Decide within {wd} working days once consent, assessment and documents are in.",
  "team.filter.decide":"Needs decision","team.filter.consent":"Waiting for consent","team.filter.progress":"In progress","team.filter.closed":"Closed","team.filter.all":"All",
  "team.col.client":"Client","team.col.agent":"Agent","team.col.checklist":"Checklist","team.col.deadline":"14-day deadline","team.col.decide":"Decide by",
  "team.check":"Consent · Assessment · Documents · Consultant call",
  "team.empty":"No leads here.",
  "team.no_agent_data":"No leads from the agent app in this browser yet. Open the <a href=\"./\" target=\"_blank\" rel=\"noopener\">agent app</a>, sign up and refer a client: the lead appears here straight away. Demo leads from other agents are shown meanwhile.",
  "team.select":"Select a lead to see the details.",
  "team.source.link":"Via agent link","team.source.form":"Agent form",
  "team.days_left":"{n} days left","team.day_left":"1 day left","team.due_today":"Due today","team.expired":"Expired","team.qualified_on":"Qualified {date}","team.rejected_on":"Rejected {date}",
  "team.sec.agent":"Agent","team.sec.consent":"Consent","team.sec.assessment":"Assessment","team.sec.documents":"Documents","team.sec.decision":"Call & decision","team.sec.log":"Activity",
  "team.agent.new":"New agent · starter bonus {used} of {n} used","team.agent.regular":"Regular bonus","team.agent.month":"Paid leads this month","team.agent.suspended":"Bonuses suspended: {pct}% of decisions this month were rejections. New bonuses go on review.",
  "team.consent.none":"Not confirmed yet. The client got a link right after the referral.",
  "team.consent.link":"Confirmed via link","team.consent.whatsapp":"Replied YES on WhatsApp","team.consent.form":"Given in the agent's link form",
  "team.consent.agent_attested":"Agent confirmed the client agreed · {date}",
  "team.consent.copy":"Copy consent link","team.consent.wa":"Consent received on WhatsApp",
  "team.consent.template_h":"First message if consent is missing",
  "team.consent.template":"Hi {client}, this is {advisor} from Lenty. {agent} referred you for mortgage advice. Reply YES to confirm we can help you.",
  "team.assess.income":"Monthly income, AED","team.assess.debts":"Monthly debts, AED","team.assess.residency":"Residency","team.assess.price":"Property price, AED","team.assess.down":"Down payment, %",
  "team.assess.save":"Save assessment","team.assess.by_agent":"Entered by the agent","team.assess.by_you":"Corrected by the consultant",
  "team.assess.yes":"Yes","team.assess.borderline":"Borderline","team.assess.no":"No","team.assess.none":"No assessment yet",
  "team.assess.dbr":"DBR {dbr}% of 50%","team.assess.min_down":"Down payment below the {min}% minimum for {res}",
  "team.docs.passport":"Passport","team.docs.eid":"Emirates ID (or visa for a non-resident)","team.docs.income":"Salary certificate or proof of income",
  "team.docs.mark":"Documents received","team.docs.eid_no":"Emirates ID number (checked for duplicates)",
  "team.toast.duplicate":"Duplicate client: {client} matches {other} ({by}). Rejected automatically.","team.docs.done":"Documents received {date}",
  "team.notes":"Notes from the call","team.notes_ph":"Intent to buy, timeline, anything the bank should know",
  "team.confirm":"Confirm qualification","team.reject":"Reject","team.reject_reason":"Reason","team.reject_pick":"Choose a reason","team.reject_go":"Reject lead","team.cancel":"Cancel",
  "team.missing":"To confirm: {items}","team.missing.consent":"client consent","team.missing.assess":"assessment Yes or Borderline","team.missing.docs":"documents",
  "team.outcome.h":"On confirm",
  "team.outcome.accrued":"{amount} {kind} bonus for {agent} · Accrued","team.outcome.on_hold":"{amount} {kind} bonus for {agent} · On review ({why})",
  "team.outcome.limit":"No bonus: {agent} reached {limit} paid leads this month","team.outcome.not_eligible":"No bonus: referred while the bonus programme was off",
  "team.kind.starter":"starter","team.kind.regular":"lead",
  "team.why.risk":"risk flag","team.why.suspended":"agent bonuses suspended",
  "team.result.qualified":"Qualified {date} by {by}","team.result.rejected":"Rejected {date}: {reason}","team.result.expired":"Expired {date}: no decision within 14 days",
  "team.decide_by":"Decide by {date}","team.decide_late":"Overdue since {date}",
  "team.risk.same_device":"Same device as the agent","team.risk.phone_other_agent":"Phone matches another agent's contact","team.risk.over_5_day":"Agent sent more than 5 leads in a day",
  "team.toast.qualified":"{client} qualified. {bonus}","team.toast.rejected":"{client} rejected: {reason}","team.toast.consent":"Consent recorded for {client}","team.toast.docs":"Documents recorded for {client}","team.toast.assess":"Assessment saved: {res}","team.toast.copied":"Consent link copied","team.toast.copy_fail":"Copy is not available here. Select the link and copy it.",
  "team.demo":"Prototype controls","team.demo.link":"Simulate: client confirmed via link","team.demo.reset":"Reset demo leads of other agents",
  "agent.msg.consent_wa":"{client} replied YES on WhatsApp. Consent confirmed.",
  "agent.msg.consent_link":"{client} confirmed consent via the link.",
  "agent.msg.docs":"Your advisor received {client}'s documents.",
  "agent.msg.assess":"Your advisor updated the assessment: {res}.",
  "agent.msg.qualified.accrued":"Qualified. {amount} {kind} bonus accrued, paid with your next weekly payout.",
  "agent.msg.qualified.on_hold":"Qualified. Your {amount} lead bonus is on review before it is accrued.",
  "agent.msg.qualified.limit":"Qualified. Monthly limit reached, so this lead doesn't earn a bonus.",
  "agent.msg.qualified.not_eligible":"Qualified. Referred while the bonus programme was off, so no lead bonus.",
  "agent.msg.qualified.plain":"Qualified. Lenty is now matching banks for {client}.",
  "agent.msg.rejected":"Not qualified: {reason}. You keep the lead protection for 90 days.",
  "agent.msg.duplicate_own":"You already referred {client} on {date}. We're working on that referral.",
  "agent.msg.duplicate_other":"This client is already registered with Lenty, so this referral isn't protected and doesn't earn a lead bonus.",
  "agent.msg.expired":"Not qualified within 14 days. The lead expired.",
};
function tx(k,v={}){const s=TXT[k];if(s==null)return k;return s.replace(/\{(\w+)\}/g,(m,n)=>n in v?v[n]:m)}

/* ===================== Reference data ===================== */
const ADVISORS=[{id:'a1',n:'Elena Petrenko'},{id:'a2',n:'Amira Haddad'},{id:'a3',n:'Farhan Qureshi'},{id:'a4',n:'Daniel Okafor'},{id:'a5',n:'Sofia Lindqvist'},{id:'a6',n:'Omar Saleh'}];
const REASONS={duplicate:'Duplicate client',assessment_no:"Doesn't meet affordability",no_response:'Client not responding',no_documents:'No documents within 14 days',fraud:'Fraud',expired:'No decision within 14 days'};
const CONSULTANT_REASONS=['duplicate','assessment_no','no_response','no_documents']; /* "fraud" is admin-only */
const RES={national:'UAE National',resident:'UAE Resident',nonresident:'Non-resident'};
const MIN_DOWN={national:15,resident:20,nonresident:40};

/* ===================== Helpers ===================== */
const $=(s)=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const aed=n=>'AED '+fmt(n);
const num=v=>+String(v??'').replace(/[^\d.]/g,'')||0;
const date=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const dt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const adv=id=>(ADVISORS.find(a=>a.id===id)||{n:'Lenty advisor'}).n;
const sameMonth=t=>{if(!t)return false;const a=new Date(t),b=new Date();return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()};
function addWorkingDays(t,n){const d=new Date(t);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}return d.getTime()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* Same formula as the agent app's assessment, plus the minimum down payment for the residency status */
function assess(i){if(!i||!i.income)return null;const loan=i.price*(1-i.down/100),r=4.25/1200,n=300,pay=loan*r/(1-Math.pow(1+r,-n));const dbr=(i.debts+pay)/i.income*100;
  let k=dbr<=42?'yes':dbr<=50?'borderline':'no';const min=MIN_DOWN[i.residency]||20;const lowDown=i.down<min;if(lowDown)k='no';return {dbr,k,lowDown,min,res:RES[i.residency]||''}}

/* ===================== Demo data: other agents and their leads ===================== */
const DEMO_AGENTS={
  g1:{name:'Sara Ali',agency:'Bayut Homes',base:{qualifiedTotal:5,starterUsed:3,monthBonuses:4,monthQualified:4,monthRejected:1}},

function agentStats(id,exceptId){

  const st={qualifiedTotal:b.qualifiedTotal+ls.filter(l=>l.q&&l.q.done).length,

    monthQualified:b.monthQualified+ls.filter(l=>l.q&&l.q.done&&sameMonth(l.q.at)).length,

/* Bonus decision at "Confirm qualification" (spec: rules of payout, promo layer, anti-fraud) */
function decideBonus(l){

  const eligible=l.bonusEligible===true||(l.bonusEligible!==false&&l.createdAt<ADMIN_DEFAULTS.lead_bonus_ends_at);
  if(!eligible)return {skip:'not_eligible'};
  const st=agentStats(l.agent,l.id);
  if(st.monthBonuses>=SETTINGS.monthly_limit)return {skip:'limit'};
  const terms=l.terms||{};
  /* starter = one of the agent's first N qualified leads (order of qualification), if starter bonuses were on at submission */
  const starterOn=terms.starterEnabled!==undefined?terms.starterEnabled:SETTINGS.starter_bonus_enabled;
  const starter=starterOn&&st.starterUsed<SETTINGS.starter_bonus_count&&st.qualifiedTotal<SETTINGS.starter_bonus_count;
  const amt=starter?(terms.starter||SETTINGS.starter_bonus_amount_aed):(terms.bonus||SETTINGS.bonus_amount_aed);
  const why=(l.riskFlags||[]).length?'risk':st.suspended?'suspended':null;

function state(l){

  for(const x of allLeads()){const xa=x.createdAt||0;if(x.id===l.id||xa>=at||xa<at-90*DAY||(x.q&&x.q.reason==='duplicate'))continue;

function verdict(as){if(!as)return `<div class="small muted">${tx('team.assess.none')}</div>`;const k={yes:'good',borderline:'warn',no:'bad'}[as.k];
  return `<div class="verdict ${k}"><span class="v">${tx('team.assess.'+as.k)}</span><span class="small num" style="text-align:right">${as.dbr?tx('team.assess.dbr',{dbr:as.dbr.toFixed(0)}):tx('team.assess.by_agent')}${as.lowDown?'<br>'+tx('team.assess.min_down',{min:as.min,res:as.res}):''}</span></div>`}
function readAssess(){return {income:num($('#a_income').value),debts:num($('#a_debts').value),residency:$('#a_res').value,price:num($('#a_price').value),down:num($('#a_down').value)}}

function bindCard(l){
  if(!l)return;const id=l.id,src=l.src,cl=l.first;
  ['a_income','a_debts','a_res','a_price','a_down'].forEach(k=>{const e=$('#'+k);if(e)e.addEventListener('input',()=>{$('#a_verdict').innerHTML=verdict(assess(readAssess()))})});
  document.querySelectorAll('[data-doc]').forEach(e=>e.addEventListener('change',()=>{const d=ui.docs[id]=ui.docs[id]||{};d[e.dataset.doc]=e.checked;const b=document.querySelector('[data-act="docs"]');if(b)b.disabled=!(d.passport&&d.eid&&d.income)}));
  const notes=$('#a_notes');if(notes)notes.addEventListener('change',()=>mutate(src,id,d=>{d.q.notes=notes.value}));
  const rs=$('#a_reason');if(rs)rs.addEventListener('change',()=>{ui.reason=rs.value;render()});
  document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act,l)));
}
async function act(a,l){
  const id=l.id,src=l.src,now=Date.now(),cl=l.first;
  if(a==='copy'){const link='https://lenty.com/c/'+id;try{await navigator.clipboard.writeText(link);toast(tx('team.toast.copied'))}catch(e){toast(tx('team.toast.copy_fail')+' '+link)}return}
  if(a==='wa'||a==='sim-link'){const m=a==='wa'?'whatsapp':'link';mutate(src,id,d=>{d.q.consent=true;d.q.method=m;d.q.consentAt=now;d.q.consentTextVersion=CONSENT_TEXT_VERSION;d.q.consentBy=a==='wa'?ui.me:null},tx(m==='whatsapp'?'agent.msg.consent_wa':'agent.msg.consent_link',{client:cl}));toast(tx('team.toast.consent',{client:cl}))}
  if(a==='assess'){const i=readAssess();const r=assess(i);mutate(src,id,d=>{d.q.input=i;d.q.assess=r?r.k:null;d.q.dbr=r?r.dbr:null;d.q.assessAt=now;d.q.assessBy=ui.me},r?tx('agent.msg.assess',{res:tx('team.assess.'+r.k)}):null);toast(tx('team.toast.assess',{res:r?tx('team.assess.'+r.k):'—'}))}
  if(a==='docs'){
    const eid=($('#a_eid')||{value:''}).value.trim();
    /* spec: duplicate by phone, email or Emirates ID among all leads in the last 90 days -> rejected automatically */
    const dup=findDuplicate(Object.assign({},l,{q:Object.assign({},l.q,{eid})}));
    if(dup){const own=dup.lead.agent===l.agent;mutate(src,id,d=>{d.q.eid=eid;d.status='lost';d.q.reason='duplicate';d.q.rejectedAt=now;d.q.auto=true;d.q.by=ui.me;d.q.dupOwn=own;if(own)d.q.dupDate=dup.lead.createdAt},dupMsg(l,own,dup.lead.createdAt));
      delete ui.docs[id];toast(tx('team.toast.duplicate',{client:cl,other:dup.lead.first+' '+(dup.lead.last||''),by:dup.by}));render();return}
    mutate(src,id,d=>{d.q.docs=true;d.q.docsAt=now;d.q.docsBy=ui.me;if(eid)d.q.eid=eid},tx('agent.msg.docs',{client:cl}));delete ui.docs[id];toast(tx('team.toast.docs',{client:cl}))}
  if(a==='reject'){ui.reject=true;ui.reason='';render();return}
  if(a==='reject-cancel'){ui.reject=false;render();return}
  if(a==='reject-go'){const r=ui.reason;if(!r)return;
    if(r==='duplicate'){const m=findDuplicate(l),own=!!(m&&m.lead.agent===l.agent);mutate(src,id,d=>{d.status='lost';d.q.reason=r;d.q.rejectedAt=now;d.q.by=ui.me;d.q.dupOwn=own;if(own)d.q.dupDate=m.lead.createdAt},dupMsg(l,own,m&&m.lead.createdAt))}
    else mutate(src,id,d=>{d.status='lost';d.q.reason=r;d.q.rejectedAt=now;d.q.by=ui.me},tx('agent.msg.rejected',{reason:REASONS[r]}));ui.reject=false;toast(tx('team.toast.rejected',{client:cl,reason:REASONS[r]}))}
  if(a==='confirm'){
    const fresh=allLeads().find(x=>x.id===id);if(!fresh||!ready(fresh))return;
    const res=decideBonus(fresh);const k=b=>tx(b.starter?'team.kind.starter':'team.kind.regular');
    let msg;if(res.skip)msg=tx('agent.msg.qualified.'+res.skip);else msg=tx('agent.msg.qualified.'+res.bonus.status,{amount:aed(res.bonus.amt),kind:k(res.bonus)});
    mutate(src,id,d=>{d.q.call=true;d.q.done=true;d.q.at=now;d.q.by=ui.me;d.stage=1;if(res.bonus){d.bonus={amt:res.bonus.amt,starter:res.bonus.starter,status:res.bonus.status,at:now}}else d.bonusSkip=res.skip},msg);
    toast(tx('team.toast.qualified',{client:cl,bonus:res.skip?tx('team.outcome.'+res.skip,{agent:agentInfo(l.agent).name,limit:SETTINGS.monthly_limit}):tx('team.outcome.'+res.bonus.status,{amount:aed(res.bonus.amt),kind:k(res.bonus),agent:agentInfo(l.agent).name,why:res.bonus.why?tx('team.why.'+res.bonus.why):''})}));
  }
  render();
}

  bindAdmin();
}
function bonusRow(x){const {l,b,a}=x,key=l.src+'|'+l.id,left=windowLeft(b),canCancel=b.status!=='cancelled'&&left>0;
  const acts=b.status==='cancelled'?`<span class="small muted">${esc(b.cancelReason||'')}${b.deducted?' · deducted':''}</span>`:
    `${b.status==='on_hold'?`<button class="btn btn-accent" data-approve="${key}">${tx('admin.approve')}</button>`:''}${canCancel?`<button class="btn btn-bad" data-cancel="${key}">${tx('admin.cancel')}</button><span class="small muted">${tx('admin.window_left',{n:left})}</span>`:`<span class="small muted">${tx('admin.window_closed')}</span>`}`;
  const form=ui.cancel===key?`<div class="brow2" style="background:var(--bad-soft)"><span style="grid-column:1/-1" class="row">
      <span class="f"><label for="cx_reason">${tx('admin.cancel_reason')}</label><select id="cx_reason">${FRAUD_REASONS.map(r=>`<option value="${r}">${tx('admin.fraud.'+r)}</option>`).join('')}</select></span>
      <span class="f" style="flex:1;min-width:200px"><label for="cx_note">${tx('admin.cancel_note')}</label><input id="cx_note"></span>
      <button class="btn btn-bad" id="cx_go" data-key="${key}">${tx('admin.cancel_go')}</button><button class="btn btn-line" id="cx_no">${tx('admin.keep')}</button>
      ${b.status==='paid'?`<span class="small" style="flex-basis:100%">${tx('admin.deduct')}</span>`:''}</span></div>`:'';
  return `<div class="brow2"><span><b style="font-weight:600">${esc(a.name)}</b><span class="small muted" style="display:block">${esc(a.agency)}</span></span><span>${esc(l.first+' '+(l.last||''))}${(l.riskFlags||[]).length?' <span class="tag risk">Risk</span>':''}</span>
    <span class="num"><b>${aed(b.amt)}</b>${b.starter?' <span class="tag">starter</span>':''}</span><span><span class="pill ${STATUS_CLS[b.status]}">${STATUS_TXT[b.status]}</span></span>
    <span class="small num">${b.at?date(b.at):'—'}</span><span class="small num">${b.paidAt?date(b.paidAt):'—'}</span><span class="row">${acts}</span></div>${form}`}
function bindAdmin(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,fn)};
  on('ad_enabled','click',()=>{saveAdmin({lead_bonus_enabled:!ADMIN.lead_bonus_enabled});toast(tx('admin.saved'));render()});
  on('ad_starter','click',()=>{saveAdmin({starter_bonus_enabled:!ADMIN.starter_bonus_enabled});toast(tx('admin.saved'));render()});
  on('ad_save_prog','click',()=>{saveAdmin({lead_bonus_starts_at:fromDateInput($('#ad_starts').value),lead_bonus_ends_at:fromDateInput($('#ad_ends').value),
    promo_slot:{text:$('#ad_slot_text').value.trim(),link:$('#ad_slot_link').value.trim(),from:fromDateInput($('#ad_slot_from').value),to:fromDateInput($('#ad_slot_to').value)}});toast(tx('admin.saved'));render()});
  on('ad_save_set','click',()=>{const v=id=>Math.max(0,num($('#'+id).value));saveAdmin({bonus_amount_aed:v('ad_bonus'),starter_bonus_amount_aed:v('ad_starter_amt'),starter_bonus_count:v('ad_starter_n'),monthly_limit:v('ad_limit'),cancel_window_days:v('ad_window')});toast(tx('admin.saved'));render()});
  ['agent','status','period'].forEach(k=>on('bf_'+k,'change',e=>{ui.bf[k]=e.target.value;render()}));
  on('ad_pay','click',()=>{ui.payConfirm=true;render()});on('ad_pay_no','click',()=>{ui.payConfirm=false;render()});
  on('ad_pay_go','click',()=>{const acc=bonuses().filter(x=>x.b.status==='accrued');const now=Date.now();let sum=0;
    acc.forEach(x=>{sum+=x.b.amt;mutate(x.l.src,x.l.id,d=>{d.bonus.status='paid';d.bonus.paidAt=now},tx('agent.msg.bonus_paid',{amount:aed(x.b.amt)}))});
    ui.payConfirm=false;toast(tx('admin.payout_done',{n:acc.length,sum:aed(sum)}));render()});
  on('ad_csv','click',exportCsv);
  on('ad_reset','click',()=>{ui.resetConfirm=true;render()});on('ad_reset_no','click',()=>{ui.resetConfirm=false;render()});
  on('ad_reset_go','click',()=>{[AGENT_KEY,TEAM_KEY,ADMIN_KEY,'lenty-team-me'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});ui.resetConfirm=false;ui.sel=null;applyAdmin();team();expireAll();render();toast('Demo data reset')});
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>{const [src,id]=b.dataset.approve.split('|');const l=allLeads().find(x=>x.id===id);
    mutate(src,id,d=>{d.bonus.status='accrued';d.bonus.approvedAt=Date.now()},tx('agent.msg.bonus_approved',{amount:aed(l.bonus.amt)}));toast('Bonus approved');render()}));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{ui.cancel=b.dataset.cancel;render()}));
  on('cx_no','click',()=>{ui.cancel=null;render()});
  on('cx_go','click',e=>{const [src,id]=e.currentTarget.dataset.key.split('|');const l=allLeads().find(x=>x.id===id);const reason=tx('admin.fraud.'+$('#cx_reason').value),note=$('#cx_note').value.trim();const wasPaid=l.bonus.status==='paid';
    mutate(src,id,d=>{d.bonus.status='cancelled';d.bonus.cancelledAt=Date.now();d.bonus.cancelReason=reason+(note?' ('+note+')':'');d.bonus.deducted=wasPaid},tx(wasPaid?'agent.msg.bonus_deducted':'agent.msg.bonus_cancelled',{amount:aed(l.bonus.amt),reason}));ui.cancel=null;toast('Bonus cancelled');render()});
  document.querySelectorAll('[data-fraud]').forEach(b=>b.addEventListener('click',()=>{const [src,id]=b.dataset.fraud.split('|');const l=allLeads().find(x=>x.id===id);const now=Date.now();
    /* spec: fraud rejection is admin-only; the bonus is cancelled by the cancellation rules (within the window; deducted if already paid) */
    const bo=l.bonus&&l.bonus.status!=='cancelled'?l.bonus:null,canCancel=bo&&windowLeft(bo)>0,wasPaid=bo&&bo.status==='paid';
    mutate(src,id,d=>{d.status='lost';d.q.reason='fraud';d.q.rejectedAt=now;d.q.by='admin';
      if(canCancel){d.bonus.status='cancelled';d.bonus.cancelledAt=now;d.bonus.cancelReason=tx('admin.fraud.lead');d.bonus.deducted=wasPaid}},
      tx('agent.msg.closed_review')+(canCancel&&wasPaid?' '+tx('agent.msg.fraud_bonus_deducted',{amount:aed(bo.amt)}):''));
    toast(canCancel?'Lead rejected as fraud, bonus cancelled':bo?'Lead rejected as fraud. Cancellation window closed, bonus kept':'Lead rejected as fraud');render()}));
}
function exportCsv(){
  const rows=[['lead_id','agent','agency','client','amount_aed','is_starter','status','created_at','approved_at','paid_at','cancelled_at','cancel_reason','deducted']];
  const iso=t=>t?new Date(t).toISOString():'';
  filteredBonuses().forEach(({l,b,a})=>rows.push([l.id,a.name,a.agency,(l.first+' '+(l.last||'')).trim(),b.amt,b.starter?'yes':'no',b.status,iso(b.at),iso(b.approvedAt),iso(b.paidAt),iso(b.cancelledAt),b.cancelReason||'',b.deducted?'yes':'no']));
  const csv=rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  try{const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='lenty-lead-bonuses-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`CSV with ${rows.length-1} bonuses downloaded`)}
  catch(e){toast('Download is not available here')}
  window.__lastCsv=csv;
}

/* ===================== Boot ===================== */
const me=$('#me');me.innerHTML=ADVISORS.map(a=>`<option value="${a.id}" ${a.id===ui.me?'selected':''}>${a.n}</option>`).join('');
me.addEventListener('change',()=>{ui.me=me.value;try{localStorage.setItem('lenty-team-me',ui.me)}catch(e){}});
applyAdmin();team();expireAll();render();
window.addEventListener('storage',e=>{if(e.key===ADMIN_KEY)applyAdmin();if(e.key===AGENT_KEY||e.key===TEAM_KEY||e.key===ADMIN_KEY){expireAll();const y=window.scrollY;render();window.scrollTo(0,y)}});
setInterval(()=>{if(expireAll())render()},60000);
fetch('icon.svg').then(r=>r.text()).then(t=>{document.getElementById('lenty').innerHTML=[...t.matchAll(/<path d="([^"]+)"/g)].map(m=>`<path d="${m[1]}"/>`).join('')}).catch(()=>{});
</script>
