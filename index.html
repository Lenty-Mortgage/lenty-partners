<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenty Partners</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#002c1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: phone app — content column over a cool off-white ground, floating navy dock; money set in Prata as the signature */
:root{
  color-scheme:light;
  --ground:#f4f2ea; --card:#fffdf8; --ink:#002c1f; --ink-2:#1e4034; --muted:#6a7069; --line:#e3dfd2; --line-2:#efece3;
  --accent:#2e6a50; --accent-ink:#1e4d3a; --accent-soft:#e4ede6;
  --cream:#eee2c9; --sand:#b79d84;
  --good:#1d7a4a; --good-soft:#e1f2e6; --warn:#9c5a00; --warn-soft:#fbf0d6; --bad:#b8382d; --bad-soft:#fbe9e6;
  --aurora:repeating-linear-gradient(100deg,#1e4034 10%,#3f7a5e 15%,#b79d84 20%,#efe2c8 25%,#2e6a50 30%);
  --display:"Prata",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#e5e2d8;font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:var(--display);font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* Device frame */
.device{width:390px;height:844px;border-radius:54px;background:#0b120f;padding:12px;box-shadow:0 30px 80px rgba(1,44,31,.28),0 0 0 2px #22302a inset;position:relative;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--ground);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px;z-index:55;pointer-events:none;color:var(--ink);transition:color .2s}
.statusbar.light{color:#fff}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:90;opacity:.85;pointer-events:none}
.homeind.light{background:#fff}
@media (max-width:500px){
  body{background:var(--ground);display:block}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .island,.statusbar,.homeind{display:none}
}

/* Views */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ground);animation:rise .24s ease}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{height:56px;flex:none}
@media (max-width:500px){.top{height:calc(12px + env(safe-area-inset-top,0px))}}
.px{padding-left:20px;padding-right:20px}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.h1{font-family:var(--display);font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
.body{font-size:15px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.divider{height:1px;background:var(--line-2)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin-left:-10px;flex:none}
.back:active{background:var(--line-2)}

/* Buttons */
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-line{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-white{background:var(--cream);color:var(--ink)}
.btn[disabled]{background:var(--line-2);color:#a8a392;pointer-events:none;border-color:transparent}
.btn-sm{height:44px;font-size:14px;border-radius:13px}
.link{color:var(--accent-ink);font-weight:600;font-size:14px}

/* Fields */
.f-label{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.f-label .opt{font-weight:400;color:var(--muted)}
.field{height:54px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field input,.field select{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;height:100%}
.field select{appearance:none;cursor:pointer}
.field .suf{color:var(--muted);font-size:14px;flex:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
textarea.area{width:100%;min-height:90px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:14px;font-size:16px;outline:0;resize:none}
textarea.area:focus{border-color:var(--accent)}
.cc{display:flex;align-items:center;gap:6px;font-weight:600;padding-right:10px;border-right:1px solid var(--line);height:28px;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line-2);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(1,44,31,.12)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;text-align:left}
.check .box{width:24px;height:24px;border-radius:8px;border:1.5px solid #c9c4b4;display:grid;place-items:center;flex:none;background:var(--card);color:#fff;transition:all .15s}
.check.on .box{background:var(--accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:var(--line-2);color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.avatar.round{border-radius:50%}
.avatar.ink{background:var(--ink);color:#fff}

/* Journey bar — signature element */
.jbar{display:flex;align-items:center;gap:3px}
.jbar i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.jbar i.done{background:var(--ink)}
.jbar i.cur{background:var(--accent);position:relative;overflow:hidden}
.jbar i.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sweep 1.8s infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.jbar .gap{width:5px;flex:none}
.jbar .key{flex:none;margin-left:4px;color:var(--line);display:grid}
.jbar .key.done{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.jbar i.cur::after,.aurora{animation:none!important}.view{animation:none}}

/* Dock */
.dock{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:24px;background:var(--ink);display:flex;align-items:center;padding:0 8px;gap:2px;z-index:40;box-shadow:0 14px 34px rgba(1,44,31,.35)}
.dock .t{flex:1;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.55);font-size:10.5px;font-weight:600}
.dock .t.on{color:#fff;background:rgba(255,255,255,.1)}
.dock .refer{height:50px;padding:0 16px;border-radius:16px;background:var(--cream);color:var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex:none;margin-left:4px}
@media (max-width:500px){.dock{bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.dock-space{height:110px}

/* Aurora */
.aurora{position:absolute;inset:-30%;background-image:var(--aurora);background-size:300% 200%;filter:blur(40px);opacity:.55;animation:aur 24s linear infinite}
@keyframes aur{from{background-position:0% 50%}to{background-position:300% 50%}}

/* Earnings hero */
.hero{border-radius:26px;background:var(--ink);color:#fff;padding:20px;position:relative;overflow:hidden;text-align:left;width:100%}
.hero .aurora{opacity:.4;inset:-60% -20% auto auto;width:120%;height:180%;mask-image:radial-gradient(circle at 80% 20%,#000,transparent 60%);-webkit-mask-image:radial-gradient(circle at 80% 20%,#000,transparent 60%)}
.hero .big{color:var(--cream);font-family:var(--display);font-size:40px;line-height:1.05;letter-spacing:-.01em;position:relative}
.hero .lbl{font-size:13px;color:rgba(255,255,255,.7);position:relative}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;margin-top:16px}
.hero .split div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
.hero .split b{display:block;font-size:16px;margin-top:2px}

/* Lists */
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line-2)}
.item:active{background:var(--line-2)}
.chev{color:#b5b09f;flex:none}
.deal{display:flex;flex-direction:column;gap:12px;padding:16px;width:100%;text-align:left}
.deal + .deal{border-top:1px solid var(--line-2)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs .n{font-size:12px;opacity:.75}

/* Timeline */
.phase-h{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.phase-h .label{color:var(--ink)}
.tl{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:4px}
.tl .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;z-index:1;color:#fff}
.tl:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl.done .d{background:var(--ink);border-color:var(--ink)}
.tl.done:not(:last-child)::before{background:var(--ink)}
.tl.cur .d{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl.cur .d::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl .t1{font-weight:600;font-size:15px}
.tl .t2{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}

/* Sheet */
.backdrop{position:absolute;inset:0;background:rgba(1,44,31,.45);z-index:80;animation:bd .2s ease}
@keyframes bd{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ground);border-radius:28px 28px 0 0;z-index:81;max-height:90%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:90%}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:#d3cebf;margin:10px auto 4px;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 14px;flex:none}
.sheet-foot{padding:12px 20px 30px;flex:none}

/* Stepper */
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}

/* OTP */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-size:24px;font-weight:600;outline:0;width:100%;font-variant-numeric:tabular-nums}
.otp input:focus{border-color:var(--accent)}

.toast{position:absolute;left:20px;right:20px;bottom:104px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:16px;font-size:14px;font-weight:500;z-index:95;animation:rise .2s;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(1,44,31,.3)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:14.5px}
.kv + .kv{border-top:1px solid var(--line-2)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.verdict{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict.good{background:var(--good-soft)}
.verdict.warn{background:var(--warn-soft)}
.verdict.bad{background:var(--bad-soft)}
.verdict .v{font-family:var(--display);font-size:26px;line-height:1.15}
.verdict.good .v{color:var(--good)}.verdict.warn .v{color:var(--warn)}.verdict.bad .v{color:var(--bad)}
.toggle{width:50px;height:30px;border-radius:999px;background:#d0cbbb;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.qr{background:#fff;border-radius:20px;padding:18px;display:grid;place-items:center;border:1px solid var(--line)}
.qr svg{width:180px;height:180px}
.ratecard{border-radius:24px;background:var(--ink);color:#fff;padding:20px;position:relative;overflow:hidden}
.rate-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.12);position:relative;font-size:15px}
.tool{display:flex;gap:14px;align-items:flex-start;padding:16px;text-align:left;width:100%}
.tool + .tool{border-top:1px solid var(--line-2)}
.tool .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.sample{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
html.mark [data-chg]{outline:2px dashed #6d4aff;outline-offset:3px;position:relative}
html.mark .item[data-chg],html.mark .brow[data-chg]{outline-offset:-2px}
html.mark .kv[data-chg]::after{right:auto!important;left:-14px}
html.mark .bonusbar[data-chg]::after{top:6px;right:6px}
html.mark .item[data-chg]::after{top:6px!important;right:6px!important}
html.mark [data-chg]::after{content:attr(data-chg);position:absolute;top:-10px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#6d4aff;color:#fff;font:700 11px/20px Inter,system-ui,sans-serif;text-align:center;z-index:6;pointer-events:none;box-shadow:0 2px 6px rgba(60,30,180,.35)}
.bonusbar{border-radius:18px;background:var(--ink);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.bonusbar .aurora{opacity:.35}
.bonusbar b{font-family:var(--display);font-weight:400;color:var(--cream);font-size:17px;line-height:1.25;position:relative;display:block}
.bonusbar .link{color:var(--cream);position:relative;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.qlist{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding:12px;border-radius:14px;background:var(--line-2)}
.qlist .row{gap:9px;font-size:13.5px}
.qlist .ok{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--good);color:#fff}
.qlist .ok svg{width:11px;height:11px}
.qlist .no{width:18px;height:18px;border-radius:50%;flex:none;border:1.5px solid #c9c4b4;background:var(--card)}
.brow{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
details.demo summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px}
details.demo summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="device">
  <div class="screen" id="screen">
    <div class="island"></div>
    <div class="statusbar" id="statusbar"><span id="clock" class="num">9:41</span><span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .7 10.4 10.4 0 0 0 .8 3.6L2 4.9a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3A5 5 0 0 1 8 6.1Zm0 3.5-2 2.1 2 .3 2-.3-2-2.1Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4" fill="none"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
    </span></div>
    <div id="app"></div>
    <div id="overlay"></div>
    <div class="homeind" id="homeind"></div>
  </div>
</div>

/* ================= Helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>+String(v??'').replace(/[^\d.]/g,'')||0;
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const aed=n=>'AED '+fmt(n);
const short=n=>n>=1e6?'AED '+(n/1e6).toFixed(n%1e6?2:0).replace(/\.?0+$/,'')+'M':aed(n);
const date=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';const d=Math.floor(s/86400);return d===1?'yesterday':d+'d ago'};
const ini=(a,b)=>esc(((a||'')[0]||'').toUpperCase()+((b||'')[0]||'').toUpperCase());
const adv=id=>ADVISORS.find(a=>a.id===id)||ADVISORS[0];
const legal=id=>LEGAL.find(a=>a.id===id)||LEGAL[0];
const comm=d=>d.loan*RATE;
const payoutAt=d=>d.disbursedAt+PAYOUT_DAYS*DAY;
const daysLeft=d=>Math.max(0,Math.ceil((payoutAt(d)-Date.now())/DAY));
const name=d=>esc(d.first+(d.last?' '+d.last:''));
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const slug=()=>S.user?(S.user.first+'-'+(S.user.last||'')[0]).toLowerCase().replace(/[^a-z0-9-]/g,''):'agent';
const refLink=()=>'lenty.com/r/'+slug();
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span style="color:var(--cream);display:grid">${I.check}</span><span>${esc(msg)}</span>`;$('#screen').appendChild(t);setTimeout(()=>t.remove(),2400)}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'Copied')}catch(e){toast('Copy not available here — select the text to copy')}}
function tick(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,15000);

function jbar(d){
  const all=d.status==='payout'||d.status==='paid';
  let h='';STAGES.forEach((s,i)=>{if(i===1||i===5||i===7)h+='<span class="gap"></span>';
    if(i===7)return; const c=all||i<d.stage?'done':(i===d.stage&&d.status==='active'?'cur':'');h+=`<i class="${c}"></i>`});
  const keyDone=all||d.stage>=7;
  return `<div class="jbar" aria-label="Stage ${Math.min(d.stage+1,8)} of 8">${h}<span class="key ${keyDone?'done':''}">${I.key}</span></div>`;
}
function statusPill(d){
  if(d.status==='payout')return `<span class="pill warn">${I.clock} Payout in ${daysLeft(d)} days</span>`;
  if(d.status==='paid')return `<span class="pill good">${I.check} Paid ${date(d.paidAt)}</span>`;
  if(d.status==='expired')return `<span class="pill bad">Expired · not qualified in 14 days</span>`;
  if(d.q&&d.q.reason==='fraud')return `<span class="pill bad">${tx('core.closed_review.status')}</span>`;
  if(d.status==='lost')return d.q&&d.q.reason?`<span class="pill bad">Not qualified · ${REASONS[d.q.reason]}</span>`:`<span class="pill bad">Not proceeding</span>`;
  if(d.stage===0&&d.q&&!d.q.done){if(!d.q.consent)return `<span class="pill warn">${I.clock} Waiting for client consent</span>`;return `<span class="pill">1/8 · Qualification · ${qDone(d)} of 4</span>`}
  if(d.status==='paused')return `<span class="pill grey">On hold</span>`;
  const s=STAGES[d.stage];return `<span class="pill">${d.stage+1}/8 · ${s.t}</span>`;
}
/* Daily job from the spec, run on open and every minute in the prototype: leads not qualified by the deadline become "expired" */
function expireLeads(){let n=0;const now=Date.now();(S.deals||[]).forEach(d=>{if(d.status==='active'&&d.stage===0&&d.q&&!d.q.done&&!d.q.reason&&d.q.deadline&&now>d.q.deadline){d.status='expired';d.q.reason='expired';d.q.expiredAt=now;d.updates.push({at:now,t:'Not qualified within 14 days. The lead expired.'});n++}});if(n)save();return n}
function qDone(d){const q=d.q||{};return [q.consent,q.assess==='yes'||q.assess==='borderline',q.docs,q.call].filter(Boolean).length}
function qLeft(d){return Math.max(0,Math.ceil((d.q.deadline-Date.now())/DAY))}
function qList(d){const q=d.q||{};const st=[q.consent,q.assess==='yes'||q.assess==='borderline',q.docs,q.call];
  const sub=[q.consent?({form:'Given in your link form',whatsapp:'Replied YES on WhatsApp'}[q.method]||'Confirmed via link'):'Link sent to your client',q.assess?({yes:'Yes',borderline:'Borderline',no:'No'}[q.assess])+(q.dbr!=null?' · DBR '+Math.round(q.dbr)+'%':''):'Not entered',q.docs?'Received by your advisor':'Passport, Emirates ID, salary certificate',q.call?'Done':'Your advisor calls after documents'];
  return `<div class="qlist">${QITEMS.map((t,i)=>`<div class="row"><span class="${st[i]?'ok':'no'}">${st[i]?I.check:''}</span><span class="grow"><b style="font-weight:600">${t}</b> <span class="muted">${sub[i]}</span></span></div>`).join('')}</div>`}
function bonusLine(d){
  if(!PROMO&&!d.bonus)return '';
  if(d.q&&d.q.reason==='fraud')return `<div class="brow"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('core.closed_review.status')}</span></span><span class="pill grey">${tx('promo.lead_bonus.no_bonus')}</span></div>`;
  if(d.q&&d.q.reason)return `<div class="brow" data-chg="3"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('promo.lead_bonus.not_qualified',{reason:REASONS[d.q.reason]})}</span></span><span class="pill grey">${tx('promo.lead_bonus.no_bonus')}</span></div>`;
  if(d.bonus){const b=d.bonus;const lab=tx('promo.lead_bonus.status.'+b.status);const k={on_hold:'grey',accrued:'warn',paid:'good',cancelled:'bad'}[b.status];
    return `<div class="brow" data-chg="2"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}${b.starter?tx('promo.lead_bonus.starter_suffix'):''}</b><span class="muted">${tx('promo.lead_bonus.line.'+(b.status==='cancelled'&&b.deducted?'cancelled_deducted':b.status),{date:date(b.status==='paid'?b.paidAt:b.at)})}</span></span><span style="text-align:right"><span class="serif num" style="font-size:20px;display:block">${aed(b.amt)}</span><span class="pill ${k}">${lab}</span></span></div>`}
  if(d.bonusSkip)return `<div class="brow"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('promo.lead_bonus.line.'+d.bonusSkip)}</span></span><span class="pill grey">${tx('promo.lead_bonus.no_bonus')}</span></div>`;
  if(d.q&&!d.q.done&&!expectedBonus(d))return d.bonusEligible===false?`<div class="brow"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('promo.lead_bonus.line.not_eligible')}</span></span><span class="pill grey">${tx('promo.lead_bonus.no_bonus')}</span></div>`:'';
  if(d.q&&!d.q.done&&expectedBonus(d).skip)return `<div class="brow"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('promo.lead_bonus.line.limit')}</span></span><span class="pill grey">${tx('promo.lead_bonus.no_bonus')}</span></div>`;
  if(d.q&&!d.q.done)return `<div class="brow" data-chg="2"><span class="grow small"><b style="font-weight:600;font-size:14px;display:block">${tx('promo.lead_bonus.title')}</b><span class="muted">${tx('promo.lead_bonus.line.pending',{n:qLeft(d)})}</span></span><span class="serif num" style="font-size:20px">${aed(expectedBonus(d).amt)}</span></div>`;
  return '';
}
function attention(){
  const out=[];
  S.deals.forEach(d=>{
    if(d.status==='active'&&d.q&&!d.q.done&&!d.q.consent)out.push({d,k:'warn',chg:1,t:`${esc(d.first)} hasn't confirmed consent yet`,s:`Ask ${esc(d.first)} to open the link from Lenty. ${qLeft(d)} days left to qualify.`});
    if(d.status==='active'&&d.q&&!d.q.done&&d.q.consent)out.push({d,k:'info',chg:1,t:`${esc(d.first)}: qualification ${qDone(d)} of 4`,s:`Documents and a call with the advisor left.${(()=>{const e=PROMO&&expectedBonus(d);return e&&e.amt?' '+tx('promo.lead_bonus.attention_suffix',{bonusAed:aed(e.amt)}):''})()}`});
    if(d.status==='active'&&d.stage>0&&d.stage<=3&&d.docs<6)out.push({d,k:'warn',t:`${esc(d.first)} still needs ${6-d.docs} document${6-d.docs>1?'s':''}`,s:'Send the upload link so the file is not delayed.'});
    if(d.status==='active'&&d.stage===5)out.push({d,k:'info',t:`Waiting for the developer NOC for ${esc(d.first)}`,s:'Lenty legal is chasing it. Usually 3–5 working days.'});
    if(d.status==='active'&&(d.stage===3||d.stage===4))out.push({d,k:'good',t:`${esc(d.first)} is pre-approved`,s:`Show properties up to ${short(d.price)}.`});
    if(d.status==='payout')out.push({d,k:'good',t:`${aed(comm(d))} payout on ${date(payoutAt(d))}`,s:`${esc(d.first)}'s loan was disbursed ${ago(d.disbursedAt)}.`});
  });
  return out;
}

function render(){
  clearInterval(tmp.timer);

  const dark=['welcome','done'].includes(R.screen);
  $('#statusbar').classList.toggle('light',dark);$('#homeind').classList.toggle('light',dark);
  AFTER[R.screen]&&AFTER[R.screen]();
}
function dock(){
  const t=(k,l)=>`<button class="t ${R.tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${I[k]}<span>${l}</span></button>`;

wallet(){
  const act=S.deals.filter(d=>d.status==='active'),pay=S.deals.filter(d=>d.status==='payout').sort((a,b)=>payoutAt(a)-payoutAt(b)),paid=S.deals.filter(d=>d.status==='paid').sort((a,b)=>b.paidAt-a.paidAt);

    <h1 class="h1" style="padding-top:6px">Wallet</h1>
    <div class="hero" style="cursor:default"><div class="aurora"></div>
      <div class="lbl">Paid to you this year</div><div class="big num" style="margin-top:6px">${aed(sum(paid.filter(d=>sameYear(d.paidAt))))}</div>

    ${(()=>{const bs=S.deals.filter(d=>d.bonus).map(d=>({d,...d.bonus})).sort((a,b)=>b.at-a.at);if(!bs.length&&!PROMO)return '';const f=tmp.bf||'all';const ls=bs.filter(b=>f==='all'||b.status===f);
      return `<div class="stack g10" data-chg="1" style="margin:0 -8px;padding:8px;border-radius:18px"><div class="row between"><span class="label">${tx('promo.lead_bonus.wallet.title')}</span><span class="small muted num">${tx('promo.lead_bonus.wallet.paid_total',{amount:aed(bs.filter(b=>b.status==='paid').reduce((a,b)=>a+b.amt,0))})}</span></div>
      <div class="row" data-chg="2" style="gap:6px;border-radius:12px">${[['all',tx('promo.lead_bonus.wallet.filter_all')],...['on_hold','accrued','paid','cancelled'].map(k=>[k,tx('promo.lead_bonus.status.'+k)])].map(([k,l])=>`<button class="pill ${f===k?'':'grey'}" style="height:30px;padding:0 12px;font-size:12.5px;${f===k?'background:var(--ink);color:#fff':''}" onclick="tmp.bf='${k}';render()">${l}</button>`).join('')}</div>
      <div class="card" style="overflow:hidden">${ls.length?ls.map(b=>`<button class="item" onclick="go('deal',{id:'${b.d.id}'})"><span class="grow"><span style="display:block;font-weight:600">${name(b.d)}</span><span class="small muted">${tx(b.starter?'promo.lead_bonus.wallet.starter':'promo.lead_bonus.wallet.regular')} · ${tx('promo.lead_bonus.wallet.line.'+b.status,{date:date(b.status==='paid'?b.paidAt:b.at)})}</span></span><span class="num" style="font-weight:700;text-align:right">${aed(b.amt)}<span style="display:block;margin-top:3px"><span class="pill ${{on_hold:'grey',accrued:'warn',paid:'good',cancelled:'bad'}[b.status]}">${tx('promo.lead_bonus.status.'+b.status)}</span></span></span></button>`).join(''):'<div class="pad small muted">'+tx('promo.lead_bonus.wallet.empty')+'</div>'}</div>
      <span class="small muted">${tx('promo.lead_bonus.wallet.note')}</span></div>`})()}
    ${pay.length?`<div class="stack g10"><span class="label">Awaiting payout</span><div class="card" style="overflow:hidden">${pay.map(d=>row(d,date(payoutAt(d)),`Disbursed ${date(d.disbursedAt)} · ${daysLeft(d)} days left`)).join('')}</div></div>`:''}
    ${act.length?`<div class="stack g10"><span class="label">In pipeline</span><div class="card" style="overflow:hidden">${act.map(d=>row(d,'expected',`${STAGES[d.stage].t} · loan ${short(d.loan)}`)).join('')}</div></div>`:''}
    ${paid.length?`<div class="stack g10"><span class="label">Paid</span><div class="card" style="overflow:hidden">${paid.map(d=>row(d,date(d.paidAt),`Loan ${short(d.loan)}`)).join('')}</div></div>`:''}

check(){
  const c=tmp.chk||(tmp.chk={res:'resident',income:35000,debts:2500,age:38,price:2000000,down:20,rate:4.25});
  const minDown={national:15,resident:20,nonresident:40}[c.res];
  const ltvCap=c.res==='nonresident'?60:c.price>5e6?(c.res==='national'?75:70):(c.res==='national'?85:80);
  const maxAge=c.res==='national'?70:65;
  const years=Math.max(1,Math.min(25,maxAge-c.age));
  const r=c.rate/1200,n=years*12,pmtF=r?r/(1-Math.pow(1+r,-n)):1/n;
  const room=c.income*0.5-c.debts;
  const maxLoanDbr=Math.max(0,room/pmtF);
  const loan=c.price*(1-c.down/100);
  const pay=loan*pmtF;
  const dbr=c.income?(c.debts+pay)/c.income*100:0;
  const ltvOk=c.down>=100-ltvCap;
  const maxPrice=Math.min(maxLoanDbr/(1-c.down/100),Infinity);
  let k,v,s;
  if(!ltvOk){k='bad';v='Down payment too low';s=`For a ${RES[c.res]} buying at this price, banks lend up to ${ltvCap}%. Your client needs at least ${100-ltvCap}% down (${aed(c.price*(100-ltvCap)/100)}).`}
  else if(dbr<=42){k='good';v='Looks affordable';s=`Total debt payments would be ${dbr.toFixed(0)}% of income, within the 50% limit. Refer now to lock in a pre-approval.`}
  else if(dbr<=50){k='warn';v='Tight, but possible';s=`Debt payments would be ${dbr.toFixed(0)}% of income, close to the 50% limit. A longer term or a larger down payment helps.`}
  else{k='bad';v='Above the 50% limit';s=`Debt payments would be ${dbr.toFixed(0)}% of income. With these numbers your client can borrow up to ${aed(maxLoanDbr)}.`}
  const fld=(id,label,val,suf,hint)=>`<div><div class="f-label">${label}</div><div class="field"><input id="${id}" inputmode="decimal" value="${val}"><span class="suf">${suf}</span></div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  return `<div class="view"><div class="top"></div>
  <div class="px row" style="flex:none;padding-bottom:8px"><button class="back" onclick="go('tools')" aria-label="Back">${I.back}</button></div>
  <div class="scroll"><div class="px stack g16">
    <div class="stack g8"><h1 class="h1">Quick check</h1><p class="body muted" style="margin:0">Know before the viewing whether a bank is likely to lend.</p></div>
    <div class="verdict ${k}"><span class="v">${v}</span><span class="body" style="color:var(--ink-2)">${s}</span></div>
    <div class="card pad stack g4">
      <div class="kv"><span>Monthly payment</span><span class="num">${aed(pay)}</span></div>
      <div class="kv"><span>Debt-to-income</span><span class="num">${dbr.toFixed(1)}% <span class="muted" style="font-weight:400">/ 50%</span></span></div>
      <div class="kv"><span>Max loan on this income</span><span class="num">${aed(maxLoanDbr)}</span></div>
      <div class="kv"><span>Max property price</span><span class="num">${aed(maxPrice)}</span></div>
      <div class="kv"><span>Term</span><span class="num">${years} years</span></div>
    </div>
    <div><div class="f-label">Residency</div><div class="seg">${Object.entries(RES).map(([k2,v2])=>`<button class="${c.res===k2?'on':''}" onclick="tmp.chk.res='${k2}';tmp.chk.down=Math.max(tmp.chk.down,${'{national:15,resident:20,nonresident:40}'}['${k2}']);render()">${v2}</button>`).join('')}</div></div>
    ${fld('c_income','Gross monthly income',fmt(c.income),'AED','Salary plus regular allowances.')}
    ${fld('c_debts','Existing monthly debts',fmt(c.debts),'AED','Loan payments plus 5% of total credit card limits.')}
    ${fld('c_price','Property price',fmt(c.price),'AED')}
    <div><div class="f-label">Down payment <span class="opt num">${c.down}% · ${aed(c.price*c.down/100)}</span></div><input type="range" id="c_down" min="${minDown}" max="80" step="5" value="${c.down}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${fld('c_age','Client age',c.age,'yrs')}${fld('c_rate','Interest rate',c.rate,'%')}</div>
    <p class="small muted" style="margin:0">Based on UAE Central Bank rules: total debt payments up to 50% of income; loan-to-value up to 80% for residents, 85% for nationals (first home under AED 5M), and typically 60% for non-residents; loans end by age 65 (residents) or 70 (nationals). Indicative only, final terms depend on the bank.</p>
    <button class="btn btn-ink" onclick="startRefer({price:${Math.round(c.price)},residency:'${c.res}',down:${c.down}})">Refer this client</button>
  </div><div style="height:40px"></div></div></div>`;
},
calc(){
  const c=tmp.calc||(tmp.calc={price:2000000,down:20,years:25,rate:4.25});
  const loan=c.price*(1-c.down/100),r=c.rate/1200,n=c.years*12;
  const pay=r?loan*r/(1-Math.pow(1+r,-n)):loan/n;
  const dld=c.price*0.04+580,reg=loan*0.0025+290,val=3000,bank=Math.min(loan*0.01,20000);
  const cash=c.price*c.down/100+dld+reg+val+bank;
  return `<div class="view"><div class="top"></div>
  <div class="px row" style="flex:none;padding-bottom:8px"><button class="back" onclick="go('tools')" aria-label="Back">${I.back}</button></div>
  <div class="scroll"><div class="px stack g16">
    <div class="stack g8"><h1 class="h1">Repayments & costs</h1></div>
    <div class="hero" style="cursor:default"><div class="aurora"></div><div class="lbl">Monthly payment</div><div class="big num" style="margin-top:6px">${aed(pay)}</div><div class="lbl num" style="margin-top:6px">${aed(loan)} loan · ${c.years} years · ${c.rate}%</div></div>
    <div><div class="f-label">Property price</div><div class="field"><input id="k_price" inputmode="numeric" value="${fmt(c.price)}"><span class="suf">AED</span></div></div>
    <div><div class="f-label">Down payment <span class="opt num">${c.down}%</span></div><input type="range" id="k_down" min="15" max="80" step="5" value="${c.down}"></div>
    <div><div class="f-label">Term <span class="opt num">${c.years} years</span></div><input type="range" id="k_years" min="5" max="25" value="${c.years}"></div>
    <div><div class="f-label">Interest rate</div><div class="field"><input id="k_rate" inputmode="decimal" value="${c.rate}"><span class="suf">%</span></div></div>
    <div class="card pad stack g4"><span class="label" style="margin-bottom:4px">Cash needed on transfer day</span>
      <div class="kv"><span>Down payment</span><span class="num">${aed(c.price*c.down/100)}</span></div>
      <div class="kv"><span>DLD transfer fee (4% + AED 580)</span><span class="num">${aed(dld)}</span></div>
      <div class="kv"><span>Mortgage registration (0.25% + AED 290)</span><span class="num">${aed(reg)}</span></div>
      <div class="kv"><span>Valuation</span><span class="num">${aed(val)}</span></div>
      <div class="kv"><span>Bank arrangement fee (up to 1%)</span><span class="num">${aed(bank)}</span></div>
      <div class="kv"><span>Lenty advice & legal</span><span style="color:var(--good)">AED 0</span></div>
      <div class="kv" style="font-size:16px"><span style="color:var(--ink);font-weight:700">Total</span><span class="num">${aed(cash)}</span></div>
    </div>
    <p class="small muted" style="margin:0">Estimate. Trustee office and agency fees are not included.</p>
    <button class="btn btn-ink" onclick="startRefer({price:${Math.round(c.price)},down:${c.down}})">Refer this client · earn ${aed(loan*RATE)}</button>
  </div><div style="height:40px"></div></div></div>`;
},

/* spec: duplicates never promise lead protection and never reveal who referred the client */
function dupText(d){return d.q&&d.q.dupOwn?tx('core.duplicate.own',{client:d.first,date:date(d.q.dupDate||d.createdAt)}):tx('core.duplicate.other')}
const TEAM_KEY='lenty-team-v1.02'; /* demo leads of other agents (consultant page), same browser */
/* one format for phone duplicates: +971 / 050 123 4567, 971501234567 and 00971 50 123 4567 are the same number */
function phoneKey(cc,ph){const c=String(cc||'').replace(/\D/g,'');let p=String(ph||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(c&&p.startsWith(c)&&p.length>c.length+6)p=p.slice(c.length);p=p.replace(/^0+/,'');return p?c+p:''}
/* Monthly counter and "new agent" from the agent's own data (spec: bonuses created this month count towards the limit, starters included).
   Sample deals are for exploring the app and never count. */
/* calendar months and years are counted in Dubai time (UTC+4, no daylight saving), wherever the viewer is */
const dubaiYM=t=>{const d=new Date(t+4*36e5);return {y:d.getUTCFullYear(),m:d.getUTCMonth()}};
const sameMonth=t=>{if(!t)return false;const a=dubaiYM(t),b=dubaiYM(Date.now());return a.y===b.y&&a.m===b.m};
const sameYear=t=>{if(!t)return false;return dubaiYM(t).y===dubaiYM(Date.now()).y};
const realDeals=()=>(S.deals||[]).filter(d=>!d.sample);
function paidLeadsThisMonth(){return realDeals().filter(d=>d.bonus&&d.bonus.status!=='cancelled'&&sameMonth(d.bonus.at)).length}
function isNewAgent(){if(!ADMIN.starter_bonus_enabled)return false;const ds=realDeals();return ds.filter(d=>d.q&&d.q.done).length<STARTER_N&&ds.filter(d=>d.bonus&&d.bonus.starter&&d.bonus.status!=='cancelled').length<STARTER_N}
/* screen previews keep their ?starter=1 / ?limit=1 switches; the live app uses the agent's real numbers */
/* What a pending lead can still earn, by the terms fixed when it was submitted. The final decision is made at qualification. */
function expectedBonus(d){
  if(d.bonus||d.bonusSkip||d.bonusEligible===false)return null;
  if(limitReached())return {skip:'limit'};
  const t=d.terms||{},starterOn=t.starterEnabled!==false;
  return {amt:starterOn&&starterBanner()?(t.starter||STARTER):(t.bonus||BONUS)};
}
function starterBanner(){return PREVIEW?!!tmp.starter:isNewAgent()}
function limitReached(){return PREVIEW?!!tmp.limit:paidLeadsThisMonth()>=LIMIT}
function findDuplicate(d){
  /* same rule as consultant.html: only an earlier lead (within 90 days before this one) makes this one a duplicate; leads already rejected as duplicates don't count */
  const at=d.createdAt||Date.now(),pk=phoneKey(d.cc,d.phone),em=(d.email||'').trim().toLowerCase(),eid=String((d.q&&d.q.eid)||'').replace(/\D/g,'');
  let others=(S.deals||[]).filter(x=>x.id!==d.id&&!x.sample);
  try{const t=JSON.parse(localStorage.getItem(TEAM_KEY)||'null');if(t&&Array.isArray(t.leads))others=others.concat(t.leads)}catch(e){}
  return others.find(x=>{const xa=x.createdAt||0;if(xa>=at||xa<at-90*DAY||(x.q&&x.q.reason==='duplicate'))return false;
    return (eid&&String((x.q&&x.q.eid)||'').replace(/\D/g,'')===eid)||(pk&&phoneKey(x.cc,x.phone)===pk)||(em&&(x.email||'').trim().toLowerCase()===em)})||null;
}

function ibanSheet(){
  sheet(sheetHead('Payout account')+`<div style="padding:0 20px" class="stack g12"><div><div class="f-label">Account holder</div><div class="field"><input id="ib_name" value="${esc(S.user.first+' '+S.user.last)}"></div></div><div><div class="f-label">IBAN</div><div class="field"><input id="ib_iban" placeholder="AE07 0331 2345 6789 0123 456" value="${esc(S.user.iban||'')}"></div><div class="hint">UAE IBANs start with AE and have 23 characters.</div></div></div>
  <div class="sheet-foot"><button class="btn btn-ink" onclick="saveIban()">Save</button></div>`);
}
function saveIban(){const v=$('#ib_iban').value.replace(/\s/g,'').toUpperCase();if(!/^AE\d{21}$/.test(v)){toast('Check the IBAN: AE followed by 21 digits');return}S.user.iban=v;S.saved=S.user;save();closeSheet();render();toast('Payout account saved')}
function editProfileSheet(){
  const u=S.user;sheet(sheetHead('Edit profile')+`<div class="scroll" style="padding:0 20px" ><div class="stack g12">${[['e_first','First name',u.first],['e_last','Last name',u.last],['e_agency','Agency',u.agency],['e_brn','Broker card number (BRN)',u.brn]].map(([id,l,v])=>`<div><div class="f-label">${l}</div><div class="field"><input id="${id}" value="${esc(v||'')}"></div></div>`).join('')}</div></div>
  <div class="sheet-foot"><button class="btn btn-ink" onclick="S.user.first=$('#e_first').value.trim()||S.user.first;S.user.last=$('#e_last').value.trim();S.user.agency=$('#e_agency').value.trim();S.user.brn=$('#e_brn').value.trim();S.saved=S.user;save();closeSheet();render();toast('Profile saved')">Save</button></div>`,'tall');
}
function contactSheet(){
  sheet(sheetHead('Partner team')+`<div style="padding:0 20px 34px" class="stack g10"><p class="body muted" style="margin:0 0 6px">Sunday to Friday, 9:00–19:00. Average reply in 5 minutes.</p>
  <button class="btn btn-ink" onclick="closeSheet();toast('Opening WhatsApp')">${I.wa} WhatsApp</button>
  <div class="card pad row"><span class="grow num" style="font-weight:600">partners@lenty.com</span><button class="link" onclick="copy('partners@lenty.com','Email copied')">Copy</button></div></div>`);
}

/* ================= Screen preview mode (?screen=…) for the screens overview ================= */
const QP=new URLSearchParams(window.__Q||location.search);
(function boot(){
  const sc=QP.get('screen');
  if(!sc||!SCREENS[sc]){
    applyAdmin();expireLeads();render();
    /* the consultant page (consultant.html) writes to the same browser storage: pick up its changes */
    window.addEventListener('storage',e=>{if(e.key===ADMIN_KEY){applyAdmin();const sc0=$('#app .scroll'),t0=sc0?sc0.scrollTop:0;render();const n0=$('#app .scroll');if(n0)n0.scrollTop=t0;return}if(e.key!==KEY)return;try{S=Object.assign(fresh(),JSON.parse(e.newValue||'{}'))}catch(err){return}
      if(!S.user&&R.screen!=='welcome'&&!['phone','otp','profile','agreement'].includes(R.screen)){go('welcome');return}
      if(R.screen==='deal'&&!S.deals.find(x=>x.id===R.params.id)){go('deals');return}
      const sc2=$('#app .scroll'),top=sc2?sc2.scrollTop:0;render();const n=$('#app .scroll');if(n)n.scrollTop=top});
    setInterval(()=>{const was=PROMO;applyAdmin();if(expireLeads()||was!==PROMO)render()},60000);
    return}
  save=()=>{};
  S=fresh();
  S.user={first:'Alex',last:'Morgan',agency:'Marina Homes Real Estate',brn:'41235',cc:'+971',phone:'50 123 4567',since:Date.now()-90*DAY,iban:''};
  S.deals=sampleDeals();S.seen=Date.now()-2*DAY;
  tmp.phone='50 123 4567';tmp.auth={cc:'+971',phone:'50 123 4567'};
  tmp.prof={first:'Alex',last:'Morgan',agency:'Marina Homes Real Estate',brn:'41235'};tmp.agree=QP.get('agree')==='1';
  PREVIEW=true;PROMO=QP.get('promo')!=='0';if(!PROMO){STAGES[0].d=tx('core.stage.qualification.no_bonus');PHASES[0][1]=tx('core.phase.qualification.no_bonus');}tmp.starter=QP.get('starter')==='1';tmp.limit=QP.get('limit')==='1';tmp.bf='all';
  const byName=n=>(S.deals.find(d=>d.first.toLowerCase()===String(n||'').toLowerCase())||S.deals[1]).id;
  const p={};
  if(sc==='deal')p.id=byName(QP.get('deal'));
  if(sc==='done')p.id=byName('yusuf');
  if(sc==='refer'){
    startRefer({first:'Maria',last:'Santos',phone:'52 334 1189',price:2400000,down:20,area:'Dubai Marina',lang:'English',advisor:'a4',income:45000,debts:3000});
    tmp.refStep=+(QP.get('step')||1);
  }
  R.screen=sc;R.params=p;if(TABS.includes(sc))R.tab=sc;
  render();
  const sh=QP.get('sheet');
  const sheets={how:howSheet,updates:updatesSheet,agreement:agreementSheet,advisor:advisorSheet,contacts:contactsSheet,iban:ibanSheet,country:()=>pickCountry('auth')};
  if(sheets[sh]){const a=document.querySelector('.view')&&null;sheets[sh]();document.querySelectorAll('.sheet,.backdrop').forEach(e=>e.style.animation='none')}
  document.querySelectorAll('.view').forEach(e=>e.style.animation='none');
  const AT=QP.get('at');if(AT){const go2=()=>{const scs=[...document.querySelectorAll('.scroll')];const sc=scs[scs.length-1];if(!sc)return;if(AT==='bottom'){sc.scrollTop=sc.scrollHeight;return}const el=document.querySelector(AT);if(!el)return;const c=el.closest('.scroll')||sc;c.scrollTop=el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-(+QP.get('off')||24)};go2();setTimeout(go2,60);}
  if(window.__MARK||QP.get('mark')==='1')document.documentElement.classList.add('mark');
})();
</script>
